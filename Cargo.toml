[package]
name = "omni-crap"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
arborium = { version = "2.17", features = [
    "lang-rust", "lang-python", "lang-javascript", "lang-typescript",
    "lang-c", "lang-cpp", "lang-go", "lang-java", "lang-c-sharp",
    "lang-ruby", "lang-php", "lang-swift", "lang-kotlin", "lang-scala",
    "lang-bash"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.31", features = ["serialize"] }
anyhow = "1.0"
regex = "1.10"
chrono = "0.4"
lru = "0.12"
flate2 = "1.0"
rayon = "1.10"
toml = "0.8"
async-trait = { version = "0.1", optional = true }
dashmap = "6.0"
ignore = "0.4.25"
comfy-table = "7.2.2"

[features]
default = []
wip = ["dep:async-trait"]

[dev-dependencies]
tempfile = "3.27.0"
